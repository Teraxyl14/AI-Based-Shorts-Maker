# Project Aether — Hardened NATS Server Configuration
# Enforces file-backed JetStream with absolute data durability

listen: 0.0.0.0:4222
http: 0.0.0.0:8222

jetstream {
    store_dir: /data/nats_store

    # Enforce fsync after every write — zero un-synced data loss window
    sync_interval: "always"

    # Conservative memory limits for edge deployment
    max_mem: 256MB
    max_file: 10GB
}

# Restrict max_ack_pending globally to prevent backpressure disconnections
# on slow compute-heavy reasoning/render nodes
max_payload: 8MB
